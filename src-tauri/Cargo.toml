[package]
name = "ibrae"
version = "0.4.5"
description = "IBRAE: a different layer of your desktop (Windows and Linux)"
edition = "2021"
license = "MIT"
repository = "https://github.com/ibrarmz/ibrae"
default-run = "ibrae"

[workspace]
members = ["hook"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
# HTTP for optional HD covers (and Linux players that give an https cover URL).
ureq = "3"
# Calendar: iCal recurrence rules and time zones.
rrule = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
# Spot a copied iCal link (only while the connect screen is open).
arboard = { version = "3", default-features = false }

# In-app updates: Windows installer / MSI, and the Linux AppImage.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# The COM `implement`/`interface` macros expand to `windows_core::…` paths.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_System_Rpc",
  "Win32_System_Wmi",
  "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = "0.13"
zbus = "5"
# Same version and features wry already uses; only for tuning the webview.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
